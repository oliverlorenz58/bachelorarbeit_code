[project]
name = "bachelor-ws"
version = "0.1.0"
description = "Bachelorarbeit: Retourenprävention mit einem RL-Agenten auf Graph-Embeddings (ASOS GraphReturns)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pyg-lib>=0.4.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch==2.5.1",
    "torch-geometric>=2.8.0.post1",
]
[tool.uv]
environments = ["sys_platform == 'linux'"]
find-links = ["https://data.pyg.org/whl/torch-2.5.0+cpu.html"]
[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
